# Set prefix to Ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Enable mouse support (scroll, pane selection, resizing)
set -g mouse on

# Copy to OS clipboard
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Intuitive split bindings; open new panes in the cwd of the current pane
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Open new windows in the cwd of the current pane
bind c new-window -c "#{pane_current_path}"

# Send Esc+Enter on Shift+Enter (for CLIs that use this to insert a newline)
bind -n S-Enter send-keys "\033\r"
